aid: umrahme
name: Umrahme
description: Umrahme is a consumer online travel platform from the Traveazy Group focused
  on the Umrah pilgrimage, letting pilgrims across the GCC, UK, US, Europe, and Egypt
  book complete Umrah packages as well as individual hotels in Makkah and Madinah,
  Haramain high-speed train tickets, ground transfers, holiday add-ons, and travel
  eSIMs. The company is an Accel portfolio company and operates a companion B2B portal
  for travel agents, mobile apps on iOS and Android, and a travel-guide blog, but
  publishes no public developer or API program.
